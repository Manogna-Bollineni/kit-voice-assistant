<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Conversation History</title>
    <meta name="theme-color" content="#0e5c6b" />
    <script src="/services/theme.js"></script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap" />
    <link rel="stylesheet" href="/styles/style.css" />
    <script type="module" src="/pages/history.js"></script>
  </head>
  <body>
    <header><div class="bar" data-header></div></header>
    <main>
      <div class="section-head">
        <h1>History</h1>
        <span class="muted" id="scope"></span>
      </div>
      <div class="history">
        <ul id="list" class="card conv-list"><li class="empty">Loading…</li></ul>
        <section id="detail" class="card transcript" aria-live="polite"><p class="empty">Choose a conversation to read it.</p></section>
      </div>
    </main>
  </body>
</html>
