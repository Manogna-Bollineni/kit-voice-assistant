<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Knotopian Institute of Technology</title>
    <meta name="theme-color" content="#0e5c6b" />
    <script src="/services/theme.js"></script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap" />
    <link rel="stylesheet" href="/styles/style.css" />
    <script type="module" src="/pages/home.js"></script>
  </head>
  <body>
    <header><div class="bar" data-header></div></header>
    <main>
      <section class="hero">
        <div class="eyebrow">Admissions open · 2027–28</div>
        <h1 id="college-name">Knotopian Institute of Technology</h1>
        <p id="intro">An autonomous engineering institution in Coimbatore, Tamil Nadu.</p>
        <div class="actions">
          <a class="btn light" href="#talk">Talk to us</a>
          <a class="btn ghost" href="/login">Student / teacher login</a>
        </div>
      </section>

      <section>
        <div class="section-head">
          <h2>Programmes</h2>
          <span class="muted">Four-year B.Tech</span>
        </div>
        <div class="courses" id="courses"><p class="muted">Loading programmes…</p></div>
        <p class="contact" id="contact"></p>
      </section>

      <section id="talk">
        <div class="section-head">
          <h2>Talk to us</h2>
          <span class="muted">Ask about eligibility, fees, dates or scholarships, or apply by voice.</span>
        </div>
        <div id="assistant"></div>
      </section>
    </main>
  </body>
</html>
